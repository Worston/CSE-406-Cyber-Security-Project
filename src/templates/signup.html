<!doctype html>
<html>
<head>
  <title>Sign Up</title>
  <style>
    body { font-family: sans-serif; max-width: 380px; margin: 60px auto; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; }
    .error { color: #b00020; }
    .badge { display: inline-block; background: #eee; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Sign Up</h2>
  <p class="badge">Defense mode: {{ 'ON' if defense else 'OFF' }}</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <input name="username" placeholder="username" required autofocus>
    <input name="password" type="password" placeholder="password" required>
    <button type="submit">Sign up</button>
  </form>
  <p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
</body>
</html>
